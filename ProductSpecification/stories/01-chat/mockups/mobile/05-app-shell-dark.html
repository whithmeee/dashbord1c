<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=375">
  <title>Навигационный каркас — мобильная тёмная тема</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script async src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root { --bg:#f5f5f7; --panel:rgba(255,255,255,.88); --panel-solid:#fff; --text:#1d1d1f; --muted:#737379; --border:rgba(20,20,24,.09); --soft:rgba(0,0,0,.045); --accent:#0071e3; --accent-soft:rgba(0,113,227,.11); --shadow:0 28px 80px rgba(25,25,32,.18); }
    [data-theme="dark"] { --bg:#0d0d0f; --panel:rgba(30,30,33,.9); --panel-solid:#1d1d20; --text:#f5f5f7; --muted:#9f9fa7; --border:rgba(255,255,255,.09); --soft:rgba(255,255,255,.06); --accent:#2997ff; --accent-soft:rgba(41,151,255,.14); --shadow:0 30px 90px rgba(0,0,0,.5); }
    * { box-sizing:border-box; }
    body { margin:0; width:375px; height:844px; overflow:hidden; background:var(--bg); color:var(--text); font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif; }
    button { color:inherit; font:inherit; }
    svg { width:18px; height:18px; stroke-width:1.8; }
    .stage { position:relative; height:100%; background:radial-gradient(circle at 90% 0%,rgba(98,126,234,.2),transparent 36%),var(--bg); }
    .background-page { display:grid; grid-template-rows:60px 1fr; height:100%; }
    .background-header { display:flex; align-items:center; justify-content:space-between; padding:0 16px; border-bottom:1px solid var(--border); }
    .background-title { display:grid; place-items:center; color:var(--muted); font-size:30px; font-weight:650; letter-spacing:-.05em; }
    .background-nav { display:none; }
    .scrim { position:absolute; inset:0; background:rgba(0,0,0,.35); backdrop-filter:blur(3px); }
    .sidebar { position:absolute; z-index:2; inset:10px auto 10px 10px; display:flex; flex-direction:column; width:340px; padding:15px 13px 12px; border:1px solid var(--border); border-radius:25px; background:var(--panel); box-shadow:var(--shadow); backdrop-filter:blur(30px) saturate(160%); animation:drawerIn .65s cubic-bezier(.22,1,.36,1) both; }
    .brand { display:flex; align-items:center; gap:10px; padding:2px 7px 12px; }
    .brand-logo { display:grid; place-items:center; width:133px; height:44px; padding:3px 7px; border-radius:12px; background:white; box-shadow:0 8px 20px rgba(0,0,0,.14); }
    .brand-logo img { display:block; width:119px; height:37px; }
    .brand-caption { color:var(--muted); font-size:8px; font-weight:600; line-height:1.35; text-transform:uppercase; letter-spacing:.07em; }
    .close { display:grid; place-items:center; margin-left:auto; width:44px; height:44px; border:0; border-radius:13px; background:var(--soft); }
    .workspace { display:grid; grid-template-columns:36px 1fr 18px; gap:9px; align-items:center; min-height:56px; padding:9px; border:1px solid var(--border); border-radius:15px; background:var(--soft); }
    .workspace-mark { display:grid; place-items:center; width:36px; height:36px; border-radius:10px; color:var(--accent); background:var(--panel-solid); }
    .workspace-name { display:block; font-size:10px; font-weight:650; }
    .workspace-handle { display:block; margin-top:3px; color:var(--muted); font-size:8px; }
    .section-label { margin:13px 9px 6px; color:var(--muted); font-size:8px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
    .navigation { display:grid; gap:2px; }
    .nav-item { display:grid; grid-template-columns:33px 1fr 6px; align-items:center; min-height:43px; padding:0 9px 0 6px; border:0; border-radius:12px; background:transparent; color:var(--muted); text-align:left; opacity:0; animation:navIn .42s cubic-bezier(.22,1,.36,1) calc(var(--index) * 35ms + 170ms) forwards; }
    .nav-item.active { color:var(--accent); background:var(--accent-soft); }
    .nav-item.active::after { width:5px; height:5px; border-radius:50%; background:var(--accent); content:""; }
    .nav-icon { display:grid; place-items:center; width:29px; height:29px; border-radius:9px; }
    .nav-label { font-size:11px; font-weight:580; }
    .sidebar-bottom { margin-top:auto; }
    .security-note { display:flex; gap:9px; margin:0 2px 9px; padding:10px; border:1px solid var(--border); border-radius:14px; background:var(--soft); }
    .security-icon { color:#34c759; }
    .security-title { font-size:9px; font-weight:650; }
    .security-copy { margin-top:3px; color:var(--muted); font-size:7px; line-height:1.4; }
    .profile { display:grid; grid-template-columns:36px 1fr 24px; gap:9px; align-items:center; padding:9px 7px 0; border-top:1px solid var(--border); }
    .avatar { display:grid; place-items:center; width:36px; height:36px; border-radius:50%; color:white; background:linear-gradient(145deg,#ff9f0a,#ff453a); font-size:10px; font-weight:700; }
    .profile-name { font-size:10px; font-weight:650; }
    .profile-caption { margin-top:3px; color:var(--muted); font-size:8px; }
    .sidebar.closed { animation:none; opacity:0; transform:translateX(-110%); transition:opacity .28s ease,transform .45s cubic-bezier(.22,1,.36,1); }
    .scrim.hidden { opacity:0; pointer-events:none; transition:opacity .3s ease; }
    .menu-button { display:grid; place-items:center; width:44px; height:44px; border:0; border-radius:12px; background:var(--soft); }
    .background-title.hidden { display:none; }
    .mobile-chat { display:none; min-height:0; grid-template-rows:1fr auto; padding:0; }
    .mobile-chat.visible { display:grid; animation:chatOpen .48s cubic-bezier(.22,1,.36,1) both; }
    .mobile-messages { display:flex; flex-direction:column; justify-content:flex-end; gap:12px; padding:20px 16px; }
    .mobile-message { max-width:82%; padding:12px 14px; border-radius:17px; background:var(--panel); font-size:12px; line-height:1.45; }
    .mobile-message.user { align-self:flex-end; color:white; background:var(--accent); border-bottom-right-radius:5px; }
    .mobile-composer { display:grid; grid-template-columns:1fr 44px; gap:7px; margin:0 12px 12px; padding:7px; border:1px solid var(--border); border-radius:17px; background:var(--panel); }
    .mobile-composer input { min-width:0; padding:0 8px; border:0; outline:0; background:transparent; color:var(--text); font:inherit; font-size:11px; }
    .mobile-send { display:grid; place-items:center; width:44px; height:44px; border:0; border-radius:12px; color:white; background:var(--accent); }
    @keyframes drawerIn { from { opacity:0; transform:translateX(-28px) scale(.98); } to { opacity:1; transform:none; } }
    @keyframes navIn { from { opacity:0; transform:translateX(-9px); } to { opacity:1; transform:none; } }
    @keyframes chatOpen { from { opacity:0; transform:translateY(14px) scale(.98); } to { opacity:1; transform:none; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; animation-delay:0ms!important; transition-duration:.01ms!important; } }
  </style>
</head>
<body>
  <div class="stage">
    <main class="background-page"><header class="background-header"><button class="menu-button" aria-label="Открыть меню" onclick="openDrawer()"><i data-lucide="menu"></i></button><strong id="backgroundHeading">Мой кабинет</strong><i data-lucide="sun"></i></header><section class="background-title" id="mobileTitle">Мой кабинет</section><section class="mobile-chat" id="mobileChat"><div class="mobile-messages"><div class="mobile-message">Здравствуйте! Чем могу помочь?</div><div class="mobile-message user">Давайте начнём новый проект.</div></div><div class="mobile-composer"><input placeholder="Напишите сообщение..."><button class="mobile-send" aria-label="Отправить"><i data-lucide="arrow-up"></i></button></div></section><nav class="background-nav"></nav></main><div class="scrim" id="scrim"></div>
    <aside class="sidebar">
      <div class="brand"><span class="brand-logo"><img src="../../../../ui/assets/osminog-company-logo.svg" alt="Osminog"></span><div class="brand-caption">Личный<br>кабинет</div><button class="close" aria-label="Закрыть меню" onclick="closeDrawer()"><i data-lucide="x"></i></button></div>
      <button class="workspace"><span class="workspace-mark"><i data-lucide="layers-3"></i></span><span><span class="workspace-name">Основное пространство</span><span class="workspace-handle">Мой проект</span></span><i data-lucide="chevrons-up-down"></i></button>
      <div class="section-label">Рабочее пространство</div>
      <nav class="navigation">
        <button class="nav-item active" style="--index:0" onclick="activateSection(this,'Мой кабинет')"><span class="nav-icon"><i data-lucide="house"></i></span><span class="nav-label">Мой кабинет</span></button>
        <button class="nav-item" style="--index:1" onclick="activateSection(this,'Чат')"><span class="nav-icon"><i data-lucide="messages-square"></i></span><span class="nav-label">Чат</span></button>
        <button class="nav-item" style="--index:2" onclick="activateSection(this,'Дашборды')"><span class="nav-icon"><i data-lucide="chart-no-axes-combined"></i></span><span class="nav-label">Дашборды</span></button>
        <button class="nav-item" style="--index:3" onclick="activateSection(this,'Автодействия')"><span class="nav-icon"><i data-lucide="zap"></i></span><span class="nav-label">Автодействия</span></button>
        <button class="nav-item" style="--index:4" onclick="activateSection(this,'Свои отчёты')"><span class="nav-icon"><i data-lucide="file-chart-column"></i></span><span class="nav-label">Свои отчёты</span></button>
        <button class="nav-item" style="--index:5" onclick="activateSection(this,'Обращения')"><span class="nav-icon"><i data-lucide="inbox"></i></span><span class="nav-label">Обращения</span></button>
        <button class="nav-item" style="--index:6" onclick="activateSection(this,'Безопасность')"><span class="nav-icon"><i data-lucide="shield-check"></i></span><span class="nav-label">Безопасность</span></button>
      </nav>
      <div class="sidebar-bottom"><div class="security-note"><i class="security-icon" data-lucide="shield-check"></i><div><div class="security-title">Контроль в ваших руках</div><div class="security-copy">Интеграции и доступы настраивает администратор пространства.</div></div></div><div class="profile"><span class="avatar">АК</span><div><div class="profile-name">Алексей Ковалёв</div><div class="profile-caption">Личный кабинет</div></div><i data-lucide="chevron-up"></i></div></div>
    </aside>
  </div>
  <script>function activateSection(item,title){document.querySelectorAll('.nav-item').forEach(button=>button.classList.remove('active'));item.classList.add('active');document.getElementById('backgroundHeading').textContent=title;const isChat=title==='Чат';document.getElementById('mobileTitle').classList.toggle('hidden',isChat);document.getElementById('mobileChat').classList.toggle('visible',isChat);if(!isChat)document.getElementById('mobileTitle').textContent=title;closeDrawer()} function closeDrawer(){document.querySelector('.sidebar').classList.add('closed');document.getElementById('scrim').classList.add('hidden')} function openDrawer(){document.querySelector('.sidebar').classList.remove('closed');document.getElementById('scrim').classList.remove('hidden')} setTimeout(()=>window.lucide&&lucide.createIcons(),800)</script>
</body>
</html>
