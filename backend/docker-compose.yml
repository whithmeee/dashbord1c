services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 1c_ai_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - 1c_network
    depends_on:
      - db
      - redis

  webserver:
    image: nginx:alpine
    container_name: 1c_ai_nginx
    restart: unless-stopped
    ports:
      - "8050:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - 1c_network
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    container_name: 1c_ai_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: 1c_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - 1c_network

  redis:
    image: redis:7-alpine
    container_name: 1c_ai_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec --save 900 1 --save 300 10 --save 60 10000
    volumes:
      - redisdata:/data
    networks:
      - 1c_network

networks:
  1c_network:
    driver: bridge

volumes:
  pgdata:
  redisdata: